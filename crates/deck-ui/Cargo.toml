[package]
name = "deck-ui"
version = "0.1.0"
edition = "2021"
description = "Types and empty hooks for the song deck. Markup and motion live in ui/."
publish = false
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.100"
